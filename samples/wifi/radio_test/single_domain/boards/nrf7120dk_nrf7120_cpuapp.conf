CONFIG_WIFI_NRF71=y
CONFIG_NRF71_RADIO_TEST=y

# nRF7120 is WiFi-only (no BLE), so exclude peripheral BLE radio test
CONFIG_SAMPLE_WIFI_RADIO_TEST_WIFI_ONLY=y

# Disable BLE peripheral radio test specific features
CONFIG_CONSOLE_HANDLER=n
CONFIG_FEM_AL_LIB=n
CONFIG_ENTROPY_GENERATOR=n
CONFIG_PSA_CRYPTO=n
CONFIG_NRFX_TIMER=n
CONFIG_DYNAMIC_INTERRUPTS=n
