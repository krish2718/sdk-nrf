CONFIG_ZTEST=y
CONFIG_ZTEST_FAIL_FAST=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536

# mbedTLS X.509 library (links mbedx509; CRT parse is on by default under this).
CONFIG_MBEDTLS_X509_LIBRARY=y

# Default y strips mbedtls_x509_crt_verify_info / mbedtls_x509_crt_info; keep them for
# failure diagnostics (NOT_TRUSTED / signature issues show up in verify_info + chain dump).
CONFIG_MBEDTLS_X509_REMOVE_INFO=n

# PSA-backed PK/RSA for certificate verify (same setting as net/download + TLS).
CONFIG_MBEDTLS_USE_PSA_CRYPTO=y

# nrf_security Kconfig only exposes CONFIG_MBEDTLS_RSA_C under LEGACY_CRYPTO_C; rsa.c is
# still built from the legacy CMake list, but operations route through PSA when USE_PSA_CRYPTO.
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y

CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_PKCS1_V15=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN_RAW=y
CONFIG_MBEDTLS_MPI_MAX_SIZE=512

# mbedTLS trace: Zephyr hook (CONFIG_MBEDTLS_DEBUG) + nrf MBEDTLS_DEBUG_C + debug.c
# linked into mbedx509 (no need for CONFIG_MBEDTLS_TLS_LIBRARY).
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MBEDTLS_DEBUG=y
CONFIG_MBEDTLS_DEBUG_C=y
CONFIG_MBEDTLS_LOG_LEVEL_DBG=y
